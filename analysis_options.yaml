# `flutter_lints` is the baseline. Everything added below caught something real
# while this app was being written — mostly missing const constructors, and the
# correctness traps around async gaps and BuildContext.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An unused element or import is a mistake, not a suggestion.
    unused_import: error
    unused_element: error
    unused_local_variable: error
    dead_code: error

  # Generated drift code is not ours to lint.
  exclude:
    - "**/*.g.dart"
    - "test/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_bool_literals_in_conditional_expressions
    - avoid_redundant_argument_values
    - avoid_slow_async_io
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - cascade_invocations
    - directives_ordering
    - join_return_with_assignment
    - literal_only_boolean_expressions
    - missing_whitespace_between_adjacent_strings
    - no_adjacent_strings_in_list
    - omit_local_variable_types
    - only_throw_errors
    - prefer_asserts_in_initializer_lists
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_named_constants
    - use_string_buffers
